<ng-container *ngIf="currentUser$ | async as user; else loginView">
  <mat-sidenav-container class="app-container">
    <!-- Sidebar Navigation -->
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="sidenavOpened" class="sidebar-nav">
      <div class="sidebar-header">
        <div class="logo-wrapper">
          <mat-icon class="logo-icon">fitness_center</mat-icon>
          <span class="logo-text">APEX<span class="logo-highlight">FIT</span></span>
        </div>
        <div class="logo-sub">GYM SUITE</div>
      </div>

      <mat-nav-list class="nav-list">
        <a mat-list-item *ngFor="let item of menuItems" [routerLink]="[item.route]" routerLinkActive="active-link"
          class="nav-item">
          <div class="nav-item-content">
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </div>
        </a>
      </mat-nav-list>

      <div class="sidebar-footer">
        <div class="user-profile-summary">
          <img [src]="user.avatarUrl" [alt]="user.name" class="footer-avatar">
          <div class="user-info">
            <div class="user-name">{{ user.name }}</div>
            <div class="user-role">{{ getRoleLabel(user.role) }}</div>
          </div>
        </div>
        <div class="app-version">Apex Fit v1.0.0</div>
      </div>
    </mat-sidenav>

    <!-- Main Content Layout -->
    <mat-sidenav-content class="main-content">
      <!-- Top Sticky Toolbar -->
      <mat-toolbar class="top-navbar glass-panel">
        <button mat-icon-button (click)="toggleSidenav()" class="menu-toggle-btn">
          <mat-icon>menu</mat-icon>
        </button>

        <span class="toolbar-title">{{ pageTitle }}</span>

        <!-- Active Gym Tenant Indicator -->
        <span class="gym-badge hide-on-mobile" *ngIf="activeGym$ | async as gym">
          <mat-icon>storefront</mat-icon>
          <span>{{ gym.gymName }}</span>
        </span>

        <span class="spacer"></span>

        <!-- System Actions -->
        <div class="navbar-actions">
          
          <!-- Gym Switcher (Super Admin only) -->
          <button mat-button [matMenuTriggerFor]="gymMenu" class="gym-switcher-btn action-btn hide-on-mobile" *ngIf="user.role === 'super-admin'">
            <mat-icon>swap_horiz</mat-icon>
            <span>Switch Gym</span>
          </button>
          <mat-menu #gymMenu="matMenu" class="premium-menu">
            <div class="menu-header">Select Gym Tenant</div>
            <button mat-menu-item *ngFor="let gym of gyms$ | async" (click)="onSwitchGym(gym.gymId)">
              <mat-icon>location_city</mat-icon>
              <span>{{ gym.gymName }}</span>
            </button>
          </mat-menu>

          <!-- Database Backend Swapper -->
          <button mat-icon-button [matMenuTriggerFor]="providerMenu" class="action-btn" matTooltip="Active Database Provider">
            <mat-icon>storage</mat-icon>
          </button>
          <mat-menu #providerMenu="matMenu" class="premium-menu">
            <div class="menu-header">Database Provider</div>
            <button mat-menu-item (click)="onSwitchProvider('MOCK')">
              <mat-icon [color]="currentProvider === 'MOCK' ? 'primary' : ''">dns</mat-icon>
              <span>Mock Database (Local)</span>
            </button>
            <button mat-menu-item (click)="onSwitchProvider('FIREBASE')">
              <mat-icon [color]="currentProvider === 'FIREBASE' ? 'primary' : ''">cloud</mat-icon>
              <span>Firebase Firestore</span>
            </button>
            <button mat-menu-item (click)="onSwitchProvider('SUPABASE')">
              <mat-icon [color]="currentProvider === 'SUPABASE' ? 'primary' : ''">bolt</mat-icon>
              <span>Supabase PostgreSQL</span>
            </button>
            <button mat-menu-item (click)="onSwitchProvider('REST')">
              <mat-icon [color]="currentProvider === 'REST' ? 'primary' : ''">api</mat-icon>
              <span>Node.js / .NET REST API</span>
            </button>
          </mat-menu>

          <!-- Theme Toggle -->
          <button mat-icon-button (click)="toggleTheme()"
            [matTooltip]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'" class="action-btn">
            <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
          </button>

          <!-- Notifications -->
          <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="action-btn">
            <mat-icon matBadge="3" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
          </button>
          <mat-menu #notificationMenu="matMenu" xPosition="before" class="premium-menu">
            <div class="menu-header">Notifications</div>
            <button mat-menu-item>
              <mat-icon color="warn">warning</mat-icon>
              <span>Membership expiring: Liam Neeson</span>
            </button>
            <button mat-menu-item>
              <mat-icon color="primary">payment</mat-icon>
              <span>New payment pending verification</span>
            </button>
            <button mat-menu-item>
              <mat-icon color="accent">people</mat-icon>
              <span>New member joined today</span>
            </button>
          </mat-menu>

          <!-- Dynamic Profile Dropdown -->
          <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="avatar-menu-btn">
            <img [src]="user.avatarUrl" [alt]="user.name" class="toolbar-avatar">
          </button>
          <mat-menu #profileMenu="matMenu" xPosition="before" class="premium-menu">
            <div class="profile-menu-header">
              <div class="name">{{ user.name }}</div>
              <div class="email">{{ user.email }}</div>
            </div>
            <mat-divider></mat-divider>
            <button mat-menu-item routerLink="/settings">
              <mat-icon>settings</mat-icon>
              <span>Settings</span>
            </button>
            <button mat-menu-item routerLink="/trainers">
              <mat-icon>sports</mat-icon>
              <span>Trainers</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="onLogout()">
              <mat-icon color="warn">logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>

      <!-- Main Dynamic Content Wrapper -->
      <div class="content-body">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<ng-template #loginView>
  <router-outlet></router-outlet>
</ng-template>
